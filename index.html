<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-skin="classic">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rin9's Website</title>
    <meta name="description" content="Rin9 的个人网站，记录日常与未来作品集。">
    <meta name="author" content="Rin9">

    <link rel="stylesheet" href="css/base.css">
    <link rel="icon" id="faviconLink" href="img/profile.jpg">
</head>
<body>

    <!-- ============ 顶部导航（外壳，切主题不变） ============ -->
    <nav class="nav">
        <div class="nav-inner">
            <a href="#home" class="nav-brand">🎐 Rin9</a>

            <div class="nav-links" id="navLinks"></div>

            <div class="nav-tools">
                <button class="icon-btn" id="skinBtn" aria-label="切换界面风格" title="切换界面">◈</button>
                <button class="icon-btn" id="themeBtn" aria-label="切换深浅色">☀️</button>
                <button class="icon-btn nav-toggle" id="navToggle" aria-label="打开菜单">☰</button>
            </div>
        </div>
    </nav>

    <!-- 界面切换菜单 -->
    <div class="skin-menu" id="skinMenu"></div>

    <!-- ============ 主题渲染区 ============ -->
    <div id="app"></div>

    <!-- ============ 灯箱（外壳） ============ -->
    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" aria-label="关闭">✕</button>
        <img id="lightboxImg" src="" alt="">
        <div class="lightbox-cap" id="lightboxCap"></div>
    </div>

    <!-- ============ 音乐播放器（外壳，切主题不断歌） ============ -->
    <!-- 注意：source 不要留空的 src —— 空 src 会被解析成页面自身地址，
         浏览器会一直尝试把 HTML 当音频加载，导致页面 load 事件永不触发，
         进而让后续动态插入的主题脚本挂住 -->
    <audio id="bgm" loop preload="none">
        <source id="bgmSource">
        您的浏览器不支持音频播放。
    </audio>

    <div class="music-panel" id="musicPanel" aria-hidden="true">
        <div class="music-head">
            <div>
                <div class="music-title" id="musicNowTitle">未在播放</div>
                <div class="music-artist" id="musicNowArtist">选一首歌开始吧</div>
            </div>
            <button class="icon-btn sm" id="musicClose" aria-label="关闭播放器">✕</button>
        </div>

        <div class="music-progress">
            <span id="musicCur">0:00</span>
            <input type="range" id="musicSeek" min="0" max="100" value="0" step="0.1">
            <span id="musicDur">0:00</span>
        </div>

        <div class="music-controls">
            <button class="icon-btn" id="musicPrev" title="上一首">⏮</button>
            <button class="btn" id="musicToggle" style="min-width:92px">▶ 播放</button>
            <button class="icon-btn" id="musicNext" title="下一首">⏭</button>
            <button class="icon-btn" id="musicLoop" title="循环模式">🔁</button>
            <button class="icon-btn" id="musicVolume" title="音量">🔊</button>
        </div>

        <div class="music-section">
            <div class="music-section-head">
                <span>歌单</span>
                <select class="sel" id="musicPlaylistSel" style="max-width:150px"></select>
            </div>
            <div class="music-list" id="musicList"></div>
        </div>

        <a class="music-more" href="music.html">
            🎧 听更多我推荐的音乐
            <span>→</span>
        </a>
    </div>
    <div class="music-backdrop" id="musicBackdrop"></div>

    <!-- 回到顶部 -->
    <button class="to-top" id="toTop" aria-label="回到顶部">↑</button>

    <!-- 数据 → 外壳 → 播放器 -->
    <script src="js/data.js"></script>
    <script src="js/core/shell.js"></script>
    <script src="js/core/player.js"></script>
</body>
</html>
